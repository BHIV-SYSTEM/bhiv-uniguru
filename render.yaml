services:
  - type: web
    name: complete-uniguru
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app/backend
      - key: UNIGURU_HOST
        value: 0.0.0.0
      - key: UNIGURU_PORT
        value: "8000"
      - key: UNIGURU_WORKERS
        value: "1"
      - key: UNIGURU_ENVIRONMENT
        value: production
      - key: UNIGURU_DEMO_AUTH_ENABLED
        value: "false"
      - key: UNIGURU_CORS_ORIGINS
        value: https://uni-guru.vercel.app
      - key: UNIGURU_CHAT_DB_PATH
        value: /var/lib/uniguru/chats.sqlite3
      - key: UNIGURU_LLM_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: UNIGURU_API_AUTH_REQUIRED
        value: "true"
      - key: UNIGURU_API_TOKEN
        sync: false
      - key: UNIGURU_API_TOKENS
        sync: false
      - key: MDU_ENABLED
        value: "false"
      - key: UNIGURU_ALLOWED_CALLERS
        value: "bhiv-assistant,gurukul-platform,internal-testing,uniguru-frontend"
      - key: EXTERNAL_API_SECRET_KEY
        sync: false
      - key: UNIGURU_ROUTER_QUEUE_LIMIT
        value: "100"
      - key: UNIGURU_ROUTER_UNVERIFIED_FALLBACK
        value: "false"
      - key: ENABLE_BUCKET_TELEMETRY
        value: "false"
      - key: ENABLE_CORE_READER
        value: "false"
      - key: ENABLE_STT
        value: "true"
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
    disk:
      name: uniguru-data
      mountPath: /var/lib/uniguru
      sizeGB: 1
