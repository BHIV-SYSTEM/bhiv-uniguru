name: UniGuru Production Infrastructure CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  API_IMAGE: bhiv/uniguru-api
  FRONTEND_IMAGE: bhiv/uniguru-frontend

jobs:
  validate:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set GitHub SHA
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Generate production Compose file
        run: |
          sed "s|IMG_TAG|$short_sha|g" \
            docker-compose.production.template.yml > docker-compose.production.yml

      - name: Create stub environment
        run: |
          printf '%s\n' 'UNIGURU_HTTP_PORT=8026' 'UNIGURU_WORKERS=1' > .env

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.production.yml config

      - name: Validate frontend image build
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${{ secrets.UNIGURU_FRONTEND_API_BASE_URL || 'http://localhost:8026' }}" \
            --build-arg VITE_API_URL="${{ secrets.UNIGURU_FRONTEND_API_BASE_URL || 'http://localhost:8026' }}" \
            --build-arg VITE_SANSKRIT_API_URL="${{ secrets.UNIGURU_FRONTEND_API_BASE_URL || 'http://localhost:8026' }}" \
            --build-arg VITE_BACKEND_URL_V1="${{ secrets.UNIGURU_FRONTEND_BACKEND_URL_V1 || 'http://localhost:8026/api/v1' }}" \
            --build-arg VITE_APP__BACKEND_GOOGLE_OAUTH_URL="${{ secrets.UNIGURU_FRONTEND_GOOGLE_OAUTH_URL || 'http://localhost:8026/auth/google/token' }}" \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.UNIGURU_GOOGLE_CLIENT_ID }}" \
            -f frontend/Dockerfile frontend

  build:
    name: Build and push production images
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        run: |
          docker buildx build --push \
            --tag "${{ env.API_IMAGE }}:${{ steps.vars.outputs.sha_short }}" \
            --tag "${{ env.API_IMAGE }}:latest" \
            -f Dockerfile .

      - name: Build and push frontend
        run: |
          docker buildx build --push \
            --build-arg VITE_API_BASE_URL="${{ secrets.UNIGURU_FRONTEND_API_BASE_URL }}" \
            --build-arg VITE_API_URL="${{ secrets.UNIGURU_FRONTEND_API_BASE_URL }}" \
            --build-arg VITE_SANSKRIT_API_URL="${{ secrets.UNIGURU_FRONTEND_API_BASE_URL }}" \
            --build-arg VITE_BACKEND_URL_V1="${{ secrets.UNIGURU_FRONTEND_BACKEND_URL_V1 }}" \
            --build-arg VITE_APP__BACKEND_GOOGLE_OAUTH_URL="${{ secrets.UNIGURU_FRONTEND_GOOGLE_OAUTH_URL }}" \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.UNIGURU_GOOGLE_CLIENT_ID }}" \
            --tag "${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}" \
            --tag "${{ env.FRONTEND_IMAGE }}:latest" \
            -f frontend/Dockerfile frontend

  deploy:
    name: Deploy to production VM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create production .env
        run: |
          cat > .env <<'EOF'
          ${{ secrets.UNIGURU_ENV_FILE }}
          EOF

      - name: Create deployment archive
        run: |
          mkdir -p deployment/deploy/nginx
          cp docker-compose.production.template.yml deployment/
          cp deploy/nginx/production.conf deployment/deploy/nginx/
          cp .env deployment/
          tar -czf deployment.tar.gz -C deployment .

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Create application directory
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh \
            -p "${{ secrets.VM_PORT }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}" \
            "mkdir -p '${{ secrets.VM_APP_DIR }}'"

      - name: Copy deployment archive
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" scp \
            -P "${{ secrets.VM_PORT }}" \
            -o StrictHostKeyChecking=no \
            deployment.tar.gz \
            "${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}:${{ secrets.VM_APP_DIR }}/deployment.tar.gz"

      - name: Deploy and health check
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh \
            -p "${{ secrets.VM_PORT }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}" \
            "bash -s" <<'EOF'
          set -euo pipefail
          APP_DIR="${{ secrets.VM_APP_DIR }}"
          cd "$APP_DIR"

          mkdir -p release_history
          tar -xzf deployment.tar.gz
          rm -f deployment.tar.gz

          docker version
          docker compose version

          echo "${{ secrets.DOCKER_PASSWORD }}" | \
            docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

          SHORT_SHA="${{ needs.build.outputs.sha_short }}"
          sed "s|IMG_TAG|$SHORT_SHA|g" \
            docker-compose.production.template.yml > docker-compose.production.yml

          docker compose -f docker-compose.production.yml config
          docker compose -f docker-compose.production.yml pull
          docker compose -f docker-compose.production.yml up -d --remove-orphans

          PUBLIC_PORT="$(docker compose -f docker-compose.production.yml port uniguru-nginx 80 | sed 's/.*://')"

          echo "Waiting for UniGuru health checks on $PUBLIC_PORT..."
          for i in {1..18}; do
            API_HEALTH=0
            FRONTEND_HEALTH=0
            PUBLIC_HEALTH=0

            docker inspect --format='{{.State.Health.Status}}' uniguru-api 2>/dev/null \
              | grep -q '^healthy$' && API_HEALTH=1 || true

            docker inspect --format='{{.State.Health.Status}}' uniguru-frontend 2>/dev/null \
              | grep -q '^healthy$' && FRONTEND_HEALTH=1 || true

            curl -fsS "http://127.0.0.1:${PUBLIC_PORT}/health" >/dev/null \
              && PUBLIC_HEALTH=1 || true

            if [ "$API_HEALTH" -eq 1 ] && \
               [ "$FRONTEND_HEALTH" -eq 1 ] && \
               [ "$PUBLIC_HEALTH" -eq 1 ]; then
              echo "UniGuru deployment is healthy."
              break
            fi

            if [ "$i" -eq 18 ]; then
              echo "Deployment health check failed."
              docker compose -f docker-compose.production.yml ps
              docker compose -f docker-compose.production.yml logs --tail=100
              exit 1
            fi

            echo "api=$API_HEALTH frontend=$FRONTEND_HEALTH public=$PUBLIC_HEALTH; retrying in 10s..."
            sleep 10
          done

          if [ ! -f release_history/RELEASE_HISTORY.md ]; then
            printf '%s\n' \
              '# UniGuru Release History' \
              '' \
              '| Timestamp | Image Tag (Git SHA) | Status | Description |' \
              '|---|---|---|---|' \
              > release_history/RELEASE_HISTORY.md
          fi

          echo "| $(date -u '+%Y-%m-%d %H:%M:%S UTC') | $SHORT_SHA | SUCCESS | Stable deployment |" \
            >> release_history/RELEASE_HISTORY.md
          EOF

  rollback:
    name: Automatic rollback
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always() && needs.deploy.result == 'failure'
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Roll back to last healthy release
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh \
            -p "${{ secrets.VM_PORT }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}" \
            "bash -s" <<'EOF'
          set -euo pipefail
          APP_DIR="${{ secrets.VM_APP_DIR }}"
          cd "$APP_DIR"

          test -f release_history/RELEASE_HISTORY.md || {
            echo "No release history exists. Rollback unavailable."
            exit 1
          }

          LAST_HEALTHY_TAG="$(
            grep -E '\| (SUCCESS|ROLLBACK_SUCCESS) \|' \
              release_history/RELEASE_HISTORY.md | tail -n 1 |
              awk -F'|' '{gsub(/[[:space:]]/, "", $3); print $3}'
          )"

          test -n "$LAST_HEALTHY_TAG" || {
            echo "No previous healthy image tag found."
            exit 1
          }

          echo "Rolling back to $LAST_HEALTHY_TAG"

          echo "${{ secrets.DOCKER_PASSWORD }}" | \
            docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

          sed "s|IMG_TAG|$LAST_HEALTHY_TAG|g" \
            docker-compose.production.template.yml > docker-compose.production.yml

          docker compose -f docker-compose.production.yml pull
          docker compose -f docker-compose.production.yml up -d --remove-orphans

          PUBLIC_PORT="$(docker compose -f docker-compose.production.yml port uniguru-nginx 80 | sed 's/.*://')"

          for i in {1..18}; do
            API_HEALTH=0
            FRONTEND_HEALTH=0
            PUBLIC_HEALTH=0

            docker inspect --format='{{.State.Health.Status}}' uniguru-api 2>/dev/null \
              | grep -q '^healthy$' && API_HEALTH=1 || true
            docker inspect --format='{{.State.Health.Status}}' uniguru-frontend 2>/dev/null \
              | grep -q '^healthy$' && FRONTEND_HEALTH=1 || true
            curl -fsS "http://127.0.0.1:${PUBLIC_PORT}/health" >/dev/null \
              && PUBLIC_HEALTH=1 || true

            if [ "$API_HEALTH" -eq 1 ] && \
               [ "$FRONTEND_HEALTH" -eq 1 ] && \
               [ "$PUBLIC_HEALTH" -eq 1 ]; then
              echo "Rollback deployment is healthy."
              echo "| $(date -u '+%Y-%m-%d %H:%M:%S UTC') | $LAST_HEALTHY_TAG | ROLLBACK_SUCCESS | Automatic rollback |" \
                >> release_history/RELEASE_HISTORY.md
              exit 0
            fi
            sleep 10
          done

          docker compose -f docker-compose.production.yml ps
          docker compose -f docker-compose.production.yml logs --tail=100
          echo "| $(date -u '+%Y-%m-%d %H:%M:%S UTC') | $LAST_HEALTHY_TAG | ROLLBACK_FAILED | Automatic rollback failed health check |" \
            >> release_history/RELEASE_HISTORY.md
          exit 1
          EOF
