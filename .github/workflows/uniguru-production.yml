name: UniGuru Production Infrastructure CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  API_IMAGE: bhiv/uniguru-2-api
  FRONTEND_IMAGE: bhiv/uniguru-2-frontend
  UNIGURU_PUBLIC_PORT: "30309"

jobs:

  # ==========================================================
  # 1. VALIDATION
  # ==========================================================

  validate:
    name: Validate deployment configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short Git SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Validate required deployment files
        run: |
          set -e

          test -f Dockerfile
          test -f frontend/Dockerfile
          test -f frontend/nginx.conf
          test -f docker-compose.production.template.yml
          test -f deploy/nginx/production.conf

          echo "All required deployment files are present."

      - name: Generate production Compose file
        run: |
          set -e

          sed \
            -e "s|IMG_TAG|$SHORT_SHA|g" \
            -e "s|bhiv/uniguru-2-api:latest|bhiv/uniguru-2-api:$SHORT_SHA|g" \
            -e "s|bhiv/uniguru-2-frontend:latest|bhiv/uniguru-2-frontend:$SHORT_SHA|g" \
            docker-compose.production.template.yml \
            > docker-compose.production.yml

          grep -E "image:.*(uniguru-2-api|uniguru-2-frontend)" \
            docker-compose.production.yml

      - name: Create validation environment
        run: |
          cat > .env.production <<'EOF'
          UNIGURU_HOST=0.0.0.0
          UNIGURU_PORT=8000
          UNIGURU_WORKERS=1
          UNIGURU_CORS_ORIGINS=http://163.128.209.18:30309
          UNIGURU_API_AUTH_REQUIRED=false
          EOF

          chmod 600 .env.production

      - name: Validate Docker Compose
        run: |
          docker compose \
            -f docker-compose.production.yml \
            config

      - name: Validate backend Python
        run: |
          python -m compileall -q backend
          echo "Backend Python compilation passed."

      - name: Validate frontend Docker build
        env:
          VITE_API_BASE_URL: ${{ secrets.UNIGURU_FRONTEND_API_BASE_URL }}
          VITE_BACKEND_URL_V1: ${{ secrets.UNIGURU_FRONTEND_BACKEND_URL_V1 }}
          VITE_GOOGLE_OAUTH_URL: ${{ secrets.UNIGURU_FRONTEND_GOOGLE_OAUTH_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.UNIGURU_GOOGLE_CLIENT_ID }}
        run: |
          set -e

          API_BASE="${VITE_API_BASE_URL:-http://163.128.209.18:30309}"
          API_V1="${VITE_BACKEND_URL_V1:-http://163.128.209.18:30309/api/v1}"
          GOOGLE_URL="${VITE_GOOGLE_OAUTH_URL:-http://163.128.209.18:30309/auth/google/token}"

          if echo "$API_BASE" | grep -Eq 'localhost|127\.0\.0\.1'; then
            echo "ERROR: Production frontend API URL cannot use localhost/127.0.0.1."
            echo "Set UNIGURU_FRONTEND_API_BASE_URL to the reachable production URL."
            exit 1
          fi

          docker build \
            --build-arg VITE_API_BASE_URL="$API_BASE" \
            --build-arg VITE_API_URL="$API_BASE" \
            --build-arg VITE_SANSKRIT_API_URL="$API_BASE" \
            --build-arg VITE_BACKEND_URL_V1="$API_V1" \
            --build-arg VITE_APP__BACKEND_GOOGLE_OAUTH_URL="$GOOGLE_URL" \
            --build-arg VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
            -f frontend/Dockerfile \
            frontend

  # ==========================================================
  # 2. BUILD + PUSH
  # ==========================================================

  build:
    name: Build and push production images
    runs-on: ubuntu-latest
    needs: validate

    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short Git SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------------------------------------
      # Backend image
      # ------------------------------------------------------

      - name: Build and push backend
        run: |
          set -e

          docker buildx build \
            --push \
            --provenance=false \
            --sbom=false \
            --tag "${{ env.API_IMAGE }}:${{ steps.vars.outputs.sha_short }}" \
            --tag "${{ env.API_IMAGE }}:latest" \
            -f Dockerfile \
            .

      # ------------------------------------------------------
      # Frontend image
      # ------------------------------------------------------

      - name: Build and push frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.UNIGURU_FRONTEND_API_BASE_URL }}
          VITE_BACKEND_URL_V1: ${{ secrets.UNIGURU_FRONTEND_BACKEND_URL_V1 }}
          VITE_GOOGLE_OAUTH_URL: ${{ secrets.UNIGURU_FRONTEND_GOOGLE_OAUTH_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.UNIGURU_GOOGLE_CLIENT_ID }}
        run: |
          set -e

          API_BASE="${VITE_API_BASE_URL:-http://163.128.209.18:30309}"
          API_V1="${VITE_BACKEND_URL_V1:-http://163.128.209.18:30309/api/v1}"
          GOOGLE_URL="${VITE_GOOGLE_OAUTH_URL:-http://163.128.209.18:30309/auth/google/token}"

          if echo "$API_BASE" | grep -Eq 'localhost|127\.0\.0\.1'; then
            echo "ERROR: Production frontend API URL cannot use localhost/127.0.0.1."
            exit 1
          fi

          docker buildx build \
            --push \
            --provenance=false \
            --sbom=false \
            --build-arg VITE_API_BASE_URL="$API_BASE" \
            --build-arg VITE_API_URL="$API_BASE" \
            --build-arg VITE_SANSKRIT_API_URL="$API_BASE" \
            --build-arg VITE_BACKEND_URL_V1="$API_V1" \
            --build-arg VITE_APP__BACKEND_GOOGLE_OAUTH_URL="$GOOGLE_URL" \
            --build-arg VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
            --tag "${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}" \
            --tag "${{ env.FRONTEND_IMAGE }}:latest" \
            -f frontend/Dockerfile \
            frontend

      - name: Docker logout
        if: always()
        run: docker logout || true

  # ==========================================================
  # 3. DEPLOY
  # ==========================================================

  deploy:
    name: Deploy to production VM
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Validate production secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          VM_IP: ${{ secrets.VM_IP }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
          UNIGURU_ENV_FILE: ${{ secrets.UNIGURU_ENV_FILE }}
        run: |
          set -e

          for name in \
            DOCKER_USERNAME \
            DOCKER_PASSWORD \
            VM_IP \
            VM_PORT \
            VM_USERNAME \
            VM_PASSWORD \
            VM_APP_DIR \
            UNIGURU_ENV_FILE
          do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "ERROR: Missing GitHub secret: $name"
              exit 1
            fi
          done

          if [ "$VM_APP_DIR" != "UNIGURU2" ]; then
            echo "ERROR: VM_APP_DIR must be exactly UNIGURU2"
            exit 1
          fi

          echo "Required deployment secrets are present."

      - name: Create production environment
        env:
          UNIGURU_ENV_FILE: ${{ secrets.UNIGURU_ENV_FILE }}
        run: |
          set -e

          printf '%s\n' "$UNIGURU_ENV_FILE" > .env.production
          chmod 600 .env.production

          test -s .env.production

      - name: Create deployment archive
        run: |
          set -e

          rm -rf deployment deployment.tar.gz
          mkdir -p deployment/deploy/nginx

          cp docker-compose.production.template.yml \
             deployment/docker-compose.production.template.yml

          cp deploy/nginx/production.conf \
             deployment/deploy/nginx/production.conf

          cp .env.production \
             deployment/.env.production

          tar -czf deployment.tar.gz \
            -C deployment \
            .

          ls -lh deployment.tar.gz

      - name: Create VM application directory
        run: |
          sshpass \
            -p "${{ secrets.VM_PASSWORD }}" \
            ssh \
            -p "${{ secrets.VM_PORT }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}" \
            "mkdir -p '${{ secrets.VM_APP_DIR }}/deploy/nginx' '${{ secrets.VM_APP_DIR }}/release_history'"

      - name: Copy deployment archive
        run: |
          sshpass \
            -p "${{ secrets.VM_PASSWORD }}" \
            scp \
            -P "${{ secrets.VM_PORT }}" \
            -o StrictHostKeyChecking=no \
            deployment.tar.gz \
            "${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}:${{ secrets.VM_APP_DIR }}/deployment.tar.gz"

      - name: Deploy application
        env:
          SHORT_SHA: ${{ needs.build.outputs.sha_short }}
          DOCKER_PASSWORD_B64: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -e

          DOCKER_PASSWORD_B64="$(printf '%s' "$DOCKER_PASSWORD_B64" | base64 -w 0)"

          sshpass \
            -p "${{ secrets.VM_PASSWORD }}" \
            ssh \
            -p "${{ secrets.VM_PORT }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}" \
            "bash -s" <<EOF

          set -euo pipefail

          APP_DIR="${{ secrets.VM_APP_DIR }}"
          SHORT_SHA="${SHORT_SHA}"
          PUBLIC_PORT="${{ env.UNIGURU_PUBLIC_PORT }}"
          DOCKER_PASSWORD_B64="${DOCKER_PASSWORD_B64}"

          cd "\$APP_DIR"

          echo "========================================="
          echo "UniGuru deployment"
          echo "Release: \$SHORT_SHA"
          echo "Directory: \$APP_DIR"
          echo "========================================="

          # -----------------------------------------------
          # Extract deployment files
          # -----------------------------------------------

          tar -xzf deployment.tar.gz
          rm -f deployment.tar.gz
          chmod 600 .env.production

          # -----------------------------------------------
          # Docker diagnostics
          # -----------------------------------------------

          docker version
          docker compose version
          docker system df || true

          # -----------------------------------------------
          # Docker Hub login
          # -----------------------------------------------

          echo "$DOCKER_PASSWORD_B64"             | base64 -d             | docker login                 -u "${{ secrets.DOCKER_USERNAME }}"                 --password-stdin

          # -----------------------------------------------
          # Generate exact release Compose file
          # -----------------------------------------------

          sed \
            -e "s|IMG_TAG|\$SHORT_SHA|g" \
            -e "s|bhiv/uniguru-2-api:latest|bhiv/uniguru-2-api:\$SHORT_SHA|g" \
            -e "s|bhiv/uniguru-2-frontend:latest|bhiv/uniguru-2-frontend:\$SHORT_SHA|g" \
            docker-compose.production.template.yml \
            > docker-compose.production.yml

          echo "Images selected for release:"
          grep -E "image:.*(uniguru-2-api|uniguru-2-frontend)" \
            docker-compose.production.yml

          docker compose \
            -f docker-compose.production.yml \
            config >/dev/null

          # -----------------------------------------------
          # Pull images one at a time with retry
          # -----------------------------------------------

          pull_with_retry() {
            IMAGE="\$1"

            for ATTEMPT in 1 2 3 4 5; do
              echo "-----------------------------------------"
              echo "Pulling \$IMAGE"
              echo "Attempt \$ATTEMPT/5"
              echo "-----------------------------------------"

              if docker pull "\$IMAGE"; then
                echo "Successfully pulled \$IMAGE"
                return 0
              fi

              if [ "\$ATTEMPT" -lt 5 ]; then
                echo "Pull failed."

                # Restart Docker only after repeated pull failures.
                echo "Docker pull failed; waiting before retry..."
                sleep 20
              fi
            done

            echo "ERROR: Failed to pull \$IMAGE"
            return 1
          }

          pull_with_retry "bhiv/uniguru-2-api:\$SHORT_SHA"
          pull_with_retry "bhiv/uniguru-2-frontend:\$SHORT_SHA"
          pull_with_retry "nginx:1.27-alpine"

          # -----------------------------------------------
          # Start deployment
          # -----------------------------------------------

          docker compose \
            -f docker-compose.production.yml \
            up -d \
            --remove-orphans

          # -----------------------------------------------
          # Health check
          # -----------------------------------------------

          echo "Waiting for UniGuru services..."

          for i in \$(seq 1 18); do

            API_HEALTH=\$(docker inspect \
              --format='{{.State.Health.Status}}' \
              uniguru-api 2>/dev/null || echo "not-found")

            BRIDGE_HEALTH=\$(docker inspect \
              --format='{{.State.Health.Status}}' \
              uniguru-bridge 2>/dev/null || echo "not-found")

            FRONTEND_HEALTH=\$(docker inspect \
              --format='{{.State.Health.Status}}' \
              uniguru-frontend 2>/dev/null || echo "not-found")

            NGINX_HEALTH=\$(docker inspect \
              --format='{{.State.Health.Status}}' \
              uniguru-nginx 2>/dev/null || echo "not-found")

            PUBLIC_HEALTH=0
            PUBLIC_READY=0
            PUBLIC_FRONTEND=0

            if curl -fsS --max-time 10 \
              "http://127.0.0.1:\${PUBLIC_PORT}/health" \
              >/dev/null 2>&1; then
              PUBLIC_HEALTH=1
            fi

            if curl -fsS --max-time 10 \
              "http://127.0.0.1:\${PUBLIC_PORT}/ready" \
              >/dev/null 2>&1; then
              PUBLIC_READY=1
            fi

            if curl -fsS --max-time 10 \
              "http://127.0.0.1:\${PUBLIC_PORT}/" \
              >/dev/null 2>&1; then
              PUBLIC_FRONTEND=1
            fi

            echo \
              "attempt=\$i api=\$API_HEALTH bridge=\$BRIDGE_HEALTH frontend=\$FRONTEND_HEALTH nginx=\$NGINX_HEALTH health=\$PUBLIC_HEALTH ready=\$PUBLIC_READY frontend_http=\$PUBLIC_FRONTEND"

            if [ "\$API_HEALTH" = "healthy" ] && \
               [ "\$BRIDGE_HEALTH" = "healthy" ] && \
               [ "\$FRONTEND_HEALTH" = "healthy" ] && \
               [ "\$NGINX_HEALTH" = "healthy" ] && \
               [ "\$PUBLIC_HEALTH" -eq 1 ] && \
               [ "\$PUBLIC_READY" -eq 1 ] && \
               [ "\$PUBLIC_FRONTEND" -eq 1 ]; then

              echo "========================================="
              echo "UniGuru deployment is healthy."
              echo "Release: \$SHORT_SHA"
              echo "URL: http://VM_IP:\${PUBLIC_PORT}"
              echo "========================================="
              break
            fi

            if [ "\$i" -eq 18 ]; then
              echo "========================================="
              echo "Deployment health check FAILED."
              echo "========================================="

              docker compose \
                -f docker-compose.production.yml \
                ps

              docker compose \
                -f docker-compose.production.yml \
                logs --tail=100

              exit 1
            fi

            sleep 10
          done

          docker logout || true

          # -----------------------------------------------
          # Release history
          # -----------------------------------------------

          if [ ! -f release_history/RELEASE_HISTORY.md ]; then
            printf '%s\n' \
              '# UniGuru Release History' \
              '' \
              '| Timestamp | Image Tag | Status | Description |' \
              '|---|---|---|---|' \
              > release_history/RELEASE_HISTORY.md
          fi

          echo \
            "| \$(date -u '+%Y-%m-%d %H:%M:%S UTC') | \$SHORT_SHA | SUCCESS | Stable deployment |" \
            >> release_history/RELEASE_HISTORY.md

          echo "\$SHORT_SHA" > release_history/LAST_GOOD_TAG

          EOF

      - name: Deployment complete
        run: |
          echo "UniGuru deployment completed successfully."
          echo "Production URL: http://163.128.209.18:${{ env.UNIGURU_PUBLIC_PORT }}"

  # ==========================================================
  # 4. AUTOMATIC ROLLBACK
  # ==========================================================

  rollback:
    name: Automatic rollback
    runs-on: ubuntu-latest

    needs:
      - build
      - deploy

    if: always() && needs.deploy.result == 'failure'

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Roll back to last known-good release
        env:
          DOCKER_PASSWORD_B64: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -e

          DOCKER_PASSWORD_B64="$(printf '%s' "$DOCKER_PASSWORD_B64" | base64 -w 0)"

          sshpass \
            -p "${{ secrets.VM_PASSWORD }}" \
            ssh \
            -p "${{ secrets.VM_PORT }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}" \
            "bash -s" <<EOF

          set -euo pipefail

          APP_DIR="${{ secrets.VM_APP_DIR }}"
          PUBLIC_PORT="${{ env.UNIGURU_PUBLIC_PORT }}"
          DOCKER_PASSWORD_B64="${DOCKER_PASSWORD_B64}"

          cd "$APP_DIR"

          if [ ! -f release_history/LAST_GOOD_TAG ]; then
            echo "No last known-good release exists."
            exit 1
          fi

          LAST_GOOD_TAG="$(cat release_history/LAST_GOOD_TAG)"

          if [ -z "$LAST_GOOD_TAG" ]; then
            echo "Last known-good tag is empty."
            exit 1
          fi

          echo "Rolling back to: $LAST_GOOD_TAG"

          echo "$DOCKER_PASSWORD_B64"             | base64 -d             | docker login                 -u "${{ secrets.DOCKER_USERNAME }}"                 --password-stdin

          sed \
            -e "s|IMG_TAG|$LAST_GOOD_TAG|g" \
            -e "s|bhiv/uniguru-2-api:latest|bhiv/uniguru-2-api:$LAST_GOOD_TAG|g" \
            -e "s|bhiv/uniguru-2-frontend:latest|bhiv/uniguru-2-frontend:$LAST_GOOD_TAG|g" \
            docker-compose.production.template.yml \
            > docker-compose.production.yml

          docker compose \
            -f docker-compose.production.yml \
            config >/dev/null

          docker pull "bhiv/uniguru-2-api:$LAST_GOOD_TAG"
          docker pull "bhiv/uniguru-2-frontend:$LAST_GOOD_TAG"
          docker pull "nginx:1.27-alpine"

          docker compose \
            -f docker-compose.production.yml \
            up -d \
            --remove-orphans

          echo "Waiting for rollback health..."

          for i in $(seq 1 18); do
            API_HEALTH=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              uniguru-api 2>/dev/null || echo "not-found")

            BRIDGE_HEALTH=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              uniguru-bridge 2>/dev/null || echo "not-found")

            FRONTEND_HEALTH=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              uniguru-frontend 2>/dev/null || echo "not-found")

            NGINX_HEALTH=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              uniguru-nginx 2>/dev/null || echo "not-found")

            PUBLIC_HEALTH=0
            PUBLIC_READY=0

            curl -fsS --max-time 10 \
              "http://127.0.0.1:${PUBLIC_PORT}/health" \
              >/dev/null 2>&1 && PUBLIC_HEALTH=1 || true

            curl -fsS --max-time 10 \
              "http://127.0.0.1:${PUBLIC_PORT}/ready" \
              >/dev/null 2>&1 && PUBLIC_READY=1 || true

            echo \
              "rollback_attempt=$i api=$API_HEALTH bridge=$BRIDGE_HEALTH frontend=$FRONTEND_HEALTH nginx=$NGINX_HEALTH health=$PUBLIC_HEALTH ready=$PUBLIC_READY"

            if [ "$API_HEALTH" = "healthy" ] && \
               [ "$BRIDGE_HEALTH" = "healthy" ] && \
               [ "$FRONTEND_HEALTH" = "healthy" ] && \
               [ "$NGINX_HEALTH" = "healthy" ] && \
               [ "$PUBLIC_HEALTH" -eq 1 ] && \
               [ "$PUBLIC_READY" -eq 1 ]; then

              if [ ! -f release_history/RELEASE_HISTORY.md ]; then
                printf '%s\n' \
                  '# UniGuru Release History' \
                  '' \
                  '| Timestamp | Image Tag | Status | Description |' \
                  '|---|---|---|---|' \
                  > release_history/RELEASE_HISTORY.md
              fi

              echo \
                "| $(date -u '+%Y-%m-%d %H:%M:%S UTC') | $LAST_GOOD_TAG | ROLLBACK_SUCCESS | Automatic rollback |" \
                >> release_history/RELEASE_HISTORY.md

              echo "$LAST_GOOD_TAG" > release_history/LAST_GOOD_TAG

              docker logout || true

              echo "Rollback completed successfully."
              exit 0
            fi

            if [ "$i" -eq 18 ]; then
              docker compose \
                -f docker-compose.production.yml \
                ps

              docker compose \
                -f docker-compose.production.yml \
                logs --tail=100

              echo "Rollback health check failed."
              exit 1
            fi

            sleep 10
          done

          EOF
