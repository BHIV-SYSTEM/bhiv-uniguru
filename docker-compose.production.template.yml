services:

  # ============================================================
  # UNIGURU FASTAPI API
  # Docker Hub: bhiv/uniguru-2-api
  # ============================================================

  uniguru-api:
    image: bhiv/uniguru-2-api:latest

    container_name: uniguru-api

    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      UNIGURU_HOST: "0.0.0.0"
      UNIGURU_PORT: "8000"
      UNIGURU_WORKERS: "1"
      PYTHONPATH: "/app/backend"

    expose:
      - "8000"

    volumes:
      - uniguru_data:/var/lib/uniguru

    networks:
      - uniguru_net

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
            'http://127.0.0.1:8000/health',
            timeout=5
          )

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s


  # ============================================================
  # UNIGURU BRIDGE
  # Uses the same UniGuru API image
  # Runs backend/bridge/server.py on port 8002 internally
  # ============================================================

  uniguru-bridge:
    image: bhiv/uniguru-2-api:latest

    container_name: uniguru-bridge

    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      PYTHONPATH: "/app/backend"
      UNIGURU_ENGINE_URL: "http://uniguru-api:8000/ask"
      UNIGURU_API_TOKEN: "${UNIGURU_API_TOKEN:-}"

    command:
      - python
      - -m
      - uvicorn
      - bridge.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"

    expose:
      - "8002"

    depends_on:
      uniguru-api:
        condition: service_healthy

    networks:
      - uniguru_net

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
            'http://127.0.0.1:8002/health',
            timeout=5
          )

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  # ============================================================
  # REACT/VITE FRONTEND
  # Docker Hub: bhiv/uniguru-2-frontend
  # ============================================================

  uniguru-frontend:
    image: bhiv/uniguru-2-frontend:latest

    container_name: uniguru-frontend

    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      uniguru-api:
        condition: service_healthy
      uniguru-bridge:
        condition: service_healthy

    networks:
      - uniguru_net

    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s


  # ============================================================
  # INTERNAL REVERSE PROXY
  #
  # VM PUBLIC PORT:
  # 30309 -> nginx:80
  #
  # Do NOT use 80 or 443 because they are already occupied.
  # ============================================================

  uniguru-nginx:
    image: nginx:1.27-alpine

    container_name: uniguru-nginx

    restart: unless-stopped

    depends_on:
      uniguru-api:
        condition: service_healthy
      uniguru-bridge:
        condition: service_healthy
      uniguru-frontend:
        condition: service_healthy

    ports:
      - "30309:80"

    volumes:
      - ./deploy/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - uniguru_net

    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/health

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s


# ==============================================================
# PERSISTENT DATA
# ==============================================================

volumes:
  uniguru_data:


# ==============================================================
# NETWORK
# ==============================================================

networks:
  uniguru_net:
    driver: bridge