upstream uniguru_api {
    server uniguru-api:8000;
    keepalive 64;
}

upstream uniguru_bridge {
    server uniguru-bridge:8002;
    keepalive 64;
}

upstream uniguru_frontend {
    server uniguru-frontend:80;
    keepalive 32;
}


server {

    listen 80;
    listen [::]:80;

    server_name _;

    client_max_body_size 25m;


    # ==========================================================
    # LEGACY / COMPATIBILITY CHAT ROUTE
    # ==========================================================

    location = /api/v1/chat/query {

        proxy_pass http://uniguru_bridge/chat;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Request-ID $request_id;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;

        proxy_send_timeout 60s;

        proxy_read_timeout 90s;
    }


    # ==========================================================
    # GURUKUL COMPATIBILITY ROUTE
    # ==========================================================

    location = /api/v1/gurukul/query {

        proxy_pass http://uniguru_bridge/integrations/gurukul/chat;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Request-ID $request_id;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;

        proxy_send_timeout 60s;

        proxy_read_timeout 90s;
    }


    # ==========================================================
    # DIRECT BRIDGE
    # ==========================================================

    location = /chat {

        proxy_pass http://uniguru_bridge/chat;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Request-ID $request_id;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;

        proxy_send_timeout 60s;

        proxy_read_timeout 90s;
    }


    # ==========================================================
    # FASTAPI ROUTES
    # ==========================================================

    location ~ ^/(auth|user|chat|guru|feature|ask|new_rag|new_query|health|ready|metrics|runtime|v2)(/|$) {

        proxy_pass http://uniguru_api;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Request-ID $request_id;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;

        proxy_send_timeout 60s;

        proxy_read_timeout 90s;
    }


    # ==========================================================
    # FRONTEND
    # ==========================================================

    location / {

        proxy_pass http://uniguru_frontend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }
}