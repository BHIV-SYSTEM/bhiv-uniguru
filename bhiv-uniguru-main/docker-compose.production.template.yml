services:

  uniguru-api:
    image: bhiv/uniguru-api:IMG_TAG
    container_name: uniguru_api
    restart: unless-stopped
    ports:
      - "8007:8000"
    env_file:
      - .env
    environment:
      - UNIGURU_HOST=0.0.0.0
      - UNIGURU_PORT=8000
    volumes:
      - uniguru_metrics:/var/lib/uniguru
    networks:
      - uniguru_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  uniguru-bridge:
    image: bhiv/uniguru-bridge:IMG_TAG
    container_name: uniguru_bridge
    restart: unless-stopped
    ports:
      - "8009:8002"
    networks:
      - uniguru_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  uniguru-frontend:
    image: bhiv/uniguru-frontend:IMG_TAG
    container_name: uniguru_frontend
    restart: unless-stopped
    ports:
      - "3006:3000"
    env_file:
      - .env.frontend
    networks:
      - uniguru_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  uniguru_net:
    driver: bridge
    name: uniguru_net

volumes:
  uniguru_metrics:
    driver: local
