version: "3.9"

services:
  uniguru-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uniguru-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      UNIGURU_HOST: "0.0.0.0"
      UNIGURU_PORT: "8000"
    expose:
      - "8000"
    volumes:
      - uniguru_metrics:/var/lib/uniguru
    networks:
      - uniguru_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  uniguru-bridge:
    image: bhiv/uniguru-api:local
    container_name: uniguru-bridge
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      UNIGURU_HOST: "0.0.0.0"
      UNIGURU_PORT: "8002"
      BRIDGE_MODE: "true"
    expose:
      - "8000"
      - "8002"
    depends_on:
      - uniguru-api
    networks:
      - uniguru_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  uniguru-frontend:
    image: bhiv/uniguru-frontend:local
    container_name: uniguru-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: "http://uniguru-api:8000"
      REACT_APP_BRIDGE_URL: "http://uniguru-bridge:8002"
    expose:
      - "80"
    depends_on:
      - uniguru-api
      - uniguru-bridge
    networks:
      - uniguru_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: uniguru-nginx
    restart: unless-stopped
    depends_on:
      - uniguru-api
      - uniguru-bridge
      - uniguru-frontend
    ports:
      - "8020:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    networks:
      - uniguru_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  certbot:
    image: certbot/certbot:latest
    container_name: uniguru-certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh -c
    command: "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    networks:
      - uniguru_net

volumes:
  certbot_www:
  certbot_conf:
  nginx_logs:
  uniguru_metrics:

networks:
  uniguru_net:
    driver: bridge
